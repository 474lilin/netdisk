# Web 容器 Nginx 配置：静态资源 + /api 反向代理到业务后端
# 上传数据不经过本代理（浏览器直传 MinIO 签名 URL），因此无上传体积瓶颈
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 大文件安全兜底（正常上传直连 MinIO，不经过 nginx）
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 反向代理到业务后端
    # 动态解析：resolver 指向 Docker 内置 DNS（127.0.0.11），proxy_pass 用变量强制 nginx
    # 按 valid=10s 缓存重新解析 server 域名——server 容器重建导致 IP 变化时无需重启 web
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://server:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长操作（如超大文件去重命中等待后台池校验）允许 1 小时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # SPA 路由回退
    # v1.1.10：index.html 必须不缓存——否则升级后浏览器仍加载旧包（用户看到「修复没生效」）
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 静态资源缓存（带内容 hash 的 js/css 可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
