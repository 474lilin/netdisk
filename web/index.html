<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="企业私有化分布式存储网盘" />
    <title>企业网盘</title>
    <style>
      /* 首屏占位：JS bundle 加载完成前的轻量提示，避免白屏 */
      #boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #f5f5f5; font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: rgba(0, 0, 0, 0.45);
      }
      #boot-splash .logo {
        width: 44px; height: 44px; border-radius: 10px;
        background: linear-gradient(135deg, #1677ff, #69b1ff);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 22px; font-weight: 600;
      }
      #boot-splash .spin {
        width: 22px; height: 22px; border: 3px solid rgba(22, 119, 255, 0.2);
        border-top-color: #1677ff; border-radius: 50%;
        animation: boot-rot 0.8s linear infinite;
      }
      @keyframes boot-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="logo">盘</div>
        <div class="spin"></div>
        <div>企业网盘加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
