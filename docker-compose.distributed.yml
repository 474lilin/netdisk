# =============================================================================
# 企业私有化网盘 - 分布式 MinIO 集群版编排（4 节点）
# 适用：跨多台服务器的生产部署（每台服务器跑 1 个 minio 节点）
# 用法: cp .env.example .env && docker compose -f docker-compose.distributed.yml up -d --build
# 注意: 集群节点数必须 >= 4（纠删码下限）；扩容/缩容见 docs/02-部署手册.md
# =============================================================================
name: minio-netdisk-distributed

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: postgres:16-alpine
    container_name: netdisk-dist-postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB:-netdisk}
      POSTGRES_USER: ${POSTGRES_USER:-netdisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netdisk} -d ${POSTGRES_DB:-netdisk}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [netdisk-net]

  # ---------- MinIO 分布式集群：4 节点，纠删码 4+4 ----------
  minio-1: &minio-node
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server --console-address ":9001" http://minio-1/data http://minio-2/data http://minio-3/data http://minio-4/data
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data-1:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [netdisk-net]

  minio-2:
    <<: *minio-node
    container_name: netdisk-dist-minio-2
    command: server --console-address ":9001" http://minio-1/data http://minio-2/data http://minio-3/data http://minio-4/data
    volumes:
      - minio-data-2:/data
    ports: []

  minio-3:
    <<: *minio-node
    container_name: netdisk-dist-minio-3
    command: server --console-address ":9001" http://minio-1/data http://minio-2/data http://minio-3/data http://minio-4/data
    volumes:
      - minio-data-3:/data
    ports: []

  minio-4:
    <<: *minio-node
    container_name: netdisk-dist-minio-4
    command: server --console-address ":9001" http://minio-1/data http://minio-2/data http://minio-3/data http://minio-4/data
    volumes:
      - minio-data-4:/data
    ports: []

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: netdisk-dist-minio-init
    restart: "no"
    depends_on:
      minio-1:
        condition: service_healthy
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-netdisk-data}
    volumes:
      - ./deploy/minio-init:/init:ro
    entrypoint: ["/bin/sh", "/init/init.sh"]
    networks: [netdisk-net]

  # ---------- 业务后端 ----------
  server:
    build:
      context: ./server
    image: minio-netdisk/server:${VERSION:-1.0.0}
    container_name: netdisk-dist-server
    restart: unless-stopped
    environment:
      <<: *common-env
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-netdisk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-netdisk}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请在 .env 中设置 JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env 中设置 JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?请在 .env 中设置 COOKIE_SECRET}
      # 集群内任意节点均可服务 S3 请求；多节点时建议前置 LB（如 nginx upstream）
      MINIO_ENDPOINT: minio-1
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?分布式部署必须填写浏览器可达的 MinIO 地址}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-netdisk-data}
      PRESIGN_EXPIRY: ${PRESIGN_EXPIRY:-3600}
      PART_SIZE: ${PART_SIZE:-16777216}
      SMALL_FILE_THRESHOLD: ${SMALL_FILE_THRESHOLD:-8388608}
      VERIFY_SHA256_THRESHOLD: ${VERIFY_SHA256_THRESHOLD:-67108864}
      DEDUP_INLINE_MAX: ${DEDUP_INLINE_MAX:-1073741824}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      QUOTA_RECOMPUTE_CRON: ${QUOTA_RECOMPUTE_CRON:-0 3 * * *}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-系统管理员}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [netdisk-net]

  # ---------- Web 前端 ----------
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: minio-netdisk/web:${VERSION:-1.0.0}
    container_name: netdisk-dist-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    networks: [netdisk-net]

volumes:
  pg-data:
  minio-data-1:
  minio-data-2:
  minio-data-3:
  minio-data-4:

networks:
  netdisk-net:
    driver: bridge
